<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A scroll-driven tour through the penthouse." />
  <title>The Penthouse — A Scrolling Tour</title>
  <link rel="preload" href="assets/fonts/Bellet.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/fonts/PFDin-Light.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- critical preloader styles, inlined to avoid any flash before the stylesheet loads -->
  <style>
    html.is-loading, html.is-loading body { overflow: hidden; height: 100%; }
    #preloader {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; place-items: center;
      background: #0e0e0f; color: #f4f1ea;
      transition: opacity 0.9s ease;
    }
    #preloader.is-done { opacity: 0; pointer-events: none; }
  </style>
  <noscript><style>html.is-loading, html.is-loading body { overflow: auto; } #preloader { display: none !important; }</style></noscript>
</head>
<body>
  <!-- Loading screen -->
  <div id="preloader" class="preloader" role="status" aria-label="Loading the residence">
    <div class="preloader__inner">
      <h1 class="preloader__title" aria-hidden="true"></h1>
      <div class="preloader__meter"><span class="preloader__bar"></span></div>
      <div class="preloader__pct">0%</div>
    </div>
  </div>

  <!-- Top progress bar -->
  <div class="progress" aria-hidden="true"><span class="progress__bar"></span></div>

  <!-- Side navigation (room dots) — populated by JS -->
  <nav class="dots" aria-label="Rooms"></nav>

  <!-- Intro hero -->
  <header class="hero" id="top">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__scrim" aria-hidden="true"></div>
    <div class="hero__inner">
      <h1 class="hero__title"></h1>
      <p class="hero__subtitle"></p>
    </div>
    <div class="hero__cue" aria-hidden="true">
      <span class="hero__cue-line"></span>
      <span class="hero__cue-chevron"></span>
    </div>
  </header>

  <!-- Tour scenes — populated by JS from window.TOUR_CONFIG -->
  <main id="tour"></main>

  <!-- Room gallery (still images) — populated by JS from TOUR_CONFIG.rooms -->
  <section id="rooms" class="rooms" aria-label="More rooms"></section>

  <!-- Outro -->
